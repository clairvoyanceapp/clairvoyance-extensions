staffKnowledge:
  markdown: |
    ## Media Vault

    A creative asset browser and viewer for workspaces containing 3D models, textures, and images.

    ### When to Use
    - User asks to "browse assets", "view textures", "preview models", or "inspect images"
    - User mentions FBX, DDS, TGA, OBJ, GLTF, or other art file formats
    - User wants to see what image/model/texture files are in their workspace

    ### Staff Actions
    - Open Media Vault from the command bar to browse workspace assets
    - Click any asset in the sidebar to open it in the viewer tab
    - Use grid view for visual browsing, list view for detailed file trees
    - Filter by asset type: 3D Models, Textures, Images, or All Assets

    ### Supported Formats
    - **3D Models**: .fbx, .obj, .gltf, .glb
    - **Textures**: .dds, .tga, .hdr, .exr
    - **Images**: .png, .jpg, .jpeg, .bmp, .svg, .webp, .gif, .psd

    ### Examples
    User: "Show me the textures in this project"
    Staff: Opens Media Vault, sets filter to Textures.

    User: "Preview that FBX model"
    Staff: Opens Media Vault, navigates to the FBX file, clicks to open viewer.
